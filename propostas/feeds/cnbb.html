<script>(function(){
  var config={"source": "cnbb", "host": "cnbb.org.br", "initial": {"name": "CNBB", "page": "https://www.cnbb.org.br/ultimas-noticias/", "feed": "https://www.cnbb.org.br/feed/", "updated_at": "2026-10-28T16:36:44.622628+00:00", "items": [{"title": "Não vos deixeis roubar a esperança!", "link": "https://www.cnbb.org.br/nao-vos-deixeis-roubar-a-esperanca/"}, {"title": "Do purgatório à plenitude da pátria celestial", "link": "https://www.cnbb.org.br/do-purgatorio-a-plenitude-da-patria-celestial/"}, {"title": "Santidade encarnada: a prática da caridade junto aos que sofrem", "link": "https://www.cnbb.org.br/santidade-encarnada-a-pratica-da-caridade-junto-aos-que-sofrem/"}]}};
  var el=document.getElementById('ss-feed-HTML11');
  if(!el)return;
  var current=config.initial;
  var cacheKey='ss-noticias-v2-'+config.source;
  function valid(source){
    if(!source||!Array.isArray(source.items)||source.items.length!==3||!isFinite(Date.parse(source.updated_at)))return false;
    return source.items.every(function(item){
      try{
        var u=new URL(item.link);
        return typeof item.title==='string'&&item.title.trim()&&u.protocol==='https:'&&
          (u.hostname===config.host||u.hostname==='www.'+config.host)&&
          !/\/(feed\/?|[^/]*\.xml)$/i.test(u.pathname);
      }catch(error){return false;}
    });
  }
  function render(source){
    if(!valid(source)||Date.parse(source.updated_at)<Date.parse(current.updated_at))return false;
    el.innerHTML='';
    source.items.forEach(function(item){
      var li=document.createElement('li'),a=document.createElement('a');
      a.href=item.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title;
      li.appendChild(a);el.appendChild(li);
    });
    el.title='Manchetes consultadas em '+new Date(source.updated_at).toLocaleString('pt-BR');
    current=source;
    return true;
  }
  render(current);
  try{render(JSON.parse(localStorage.getItem(cacheKey)));}catch(error){}
  var ctl=window.AbortController?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort();},8000);
  fetch('https://raw.githubusercontent.com/charlieleitao-spec/somos-servos-app/main/data/noticias-igreja.json',ctl?{signal:ctl.signal}:{}).
    then(function(response){if(!response.ok)throw new Error('http');return response.json();}).
    then(function(data){
      var source=data.sources&&data.sources[config.source];
      if(render(source)){try{localStorage.setItem(cacheKey,JSON.stringify(source));}catch(error){}}
    }).catch(function(){}).then(function(){clearTimeout(timer);});
})();</script></details>
