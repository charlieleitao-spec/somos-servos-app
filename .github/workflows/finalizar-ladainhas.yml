name: Finalizar série das Ladainhas no Blogger

on:
  workflow_dispatch:
    inputs:
      conclusion_markdown:
        description: "Texto integral finalizado da conclusão (Markdown)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar conclusão, criar índice e atualizar navegação
        env:
          BLOGGER_CLIENT_ID: \${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: \${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: \${{ secrets.BLOGGER_REFRESH_TOKEN || secrets.BLOGGER_REFFRESH_TOKEN }}
          CONCLUSION_MARKDOWN: \${{ inputs.conclusion_markdown }}
        run: python blogger_finalize_ladainhas.py
