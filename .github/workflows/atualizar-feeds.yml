name: Atualizar manchetes dos feeds

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/atualizar-feeds.py'
      - '.github/workflows/atualizar-feeds.yml'

permissions:
  contents: write

concurrency:
  group: somos-servos-feeds
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar leitura e preservação dos feeds
        run: python3 -m unittest discover -s tests -p test_feeds_noticias.py
      - name: Consultar fontes oficiais
        run: python3 scripts/atualizar-feeds.py
      - name: Salvar novas manchetes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/noticias-igreja.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza manchetes da Igreja [skip ci]'
            git push origin HEAD:main
          fi
