name: Build APK Somos Servos

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest service-worker.js sw.js icon-192.png icon-512.png icon.svg www/

      - name: Adicionar Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: somos-servos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
