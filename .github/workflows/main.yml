name: Build APK Somos Servos

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.webmanifest service-worker.js  icon-192.png icon-512.png icon.svg www/

      - name: Adicionar Android
        run: npx cap add android

      - name: Gerar ícone oficial Android
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for item in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${item%%:*}"
            size="${item##*:}"
            output="android/app/src/main/res/mipmap-${density}"
            mkdir -p "${output}"
            convert icon-512.png -resize "${size}x${size}" "${output}/ic_launcher.png"
            cp "${output}/ic_launcher.png" "${output}/ic_launcher_round.png"
          done

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK de teste
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: somos-servos-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar link direto do APK de teste
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Somos Servos APK de teste #${GITHUB_RUN_NUMBER}" \
            --notes "APK debug para testes. Não é uma versão estável assinada para distribuição geral." \
            --prerelease
