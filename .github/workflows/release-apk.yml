name: Arquivo da publicação Somos Servos 1.0.5

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: somos-servos-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir fonte aprovada e regressões
        run: |
          python3 scripts/verify-approved-1.0.5.py
          node tests/test_android_back.cjs
          node tests/test_service_worker.cjs
      - name: Recuperar APK conferido no A56
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/charlieleitao-spec/somos-servos-app/actions/runs/42597110354 > origem.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('origem.json').read_text())
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_sha']=='69585268cc4f5e6245d043e7100f6a0ba91f8290'
          PY
          gh api repos/charlieleitao-spec/somos-servos-app/actions/artifacts/13663923415/zip > candidato.zip
          echo '05c212149b7607d9964dd6b26d0317635d44d173dd23818c624db3cc89881a9c  candidato.zip' | sha256sum --check
          mkdir candidato
          unzip -q candidato.zip -d candidato
          cp candidato/Somos-Servos-1.0.5-teste.apk Somos-Servos-1.0.5.apk
          python3 scripts/verify-approved-1.0.5.py --apk Somos-Servos-1.0.5.apk
      - name: Conferir assinatura, pacote e permissões
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs Somos-Servos-1.0.5.apk > assinatura.txt
          grep -q 'certificate SHA-256 digest: b2cda5dccd59922dfef15d45ac8f61a34c99a44c5787902243b164b28f0f4553' assinatura.txt
          "$build_tools/aapt" dump badging Somos-Servos-1.0.5.apk > identidade.txt
          grep -F "package: name='br.com.somosservos.app' versionCode='1000005' versionName='1.0.5'" identidade.txt
          "$build_tools/aapt" dump permissions Somos-Servos-1.0.5.apk > permissoes.txt
          gh release download v1.0.4 --repo "$GITHUB_REPOSITORY" --pattern Somos-Servos-1.0.4.apk --dir baseline
          "$build_tools/apksigner" verify --print-certs baseline/Somos-Servos-1.0.4.apk > assinatura-anterior.txt
          "$build_tools/aapt" dump permissions baseline/Somos-Servos-1.0.4.apk > permissoes-anteriores.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          cert=lambda p:re.search(r'certificate SHA-256 digest: ([a-f0-9]+)',Path(p).read_text())[1]
          assert cert('assinatura.txt')==cert('assinatura-anterior.txt')
          permissions=lambda p:set(re.findall(r"uses-permission: name='([^']+)'",Path(p).read_text()))
          current=permissions('permissoes.txt')
          assert current==permissions('permissoes-anteriores.txt')
          assert {p for p in current if p.startswith('android.permission.')}=={'android.permission.INTERNET'}
          PY
          sha256sum Somos-Servos-1.0.5.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Somos-Servos-1.0.5-definitivo
          path: |
            Somos-Servos-1.0.5.apk
            SHA256SUMS.txt
            assinatura.txt
            identidade.txt
            permissoes.txt
          if-no-files-found: error
      - name: Publicar versão aprovada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.5 >/dev/null; then
            echo 'A tag v1.0.5 já existe; interrompido sem substituição.'
            exit 1
          fi
          gh release create v1.0.5 Somos-Servos-1.0.5.apk SHA256SUMS.txt assinatura.txt identidade.txt permissoes.txt --target "$GITHUB_SHA" --title 'Somos Servos 1.0.5' --notes-file docs/releases/1.0.5.md --latest
      - name: Conferir download público
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --location --retry 4 --retry-delay 5 --output /tmp/Somos-Servos-1.0.5-publicado.apk https://github.com/charlieleitao-spec/somos-servos-app/releases/download/v1.0.5/Somos-Servos-1.0.5.apk
          cmp Somos-Servos-1.0.5.apk /tmp/Somos-Servos-1.0.5-publicado.apk
