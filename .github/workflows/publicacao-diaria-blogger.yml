name: Publicação diária Somos Servos

on:
  schedule:
    - cron: "5 9 * * *"
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      publish_date:
        description: "Data para validar (AAAA-MM-DD; vazio = hoje em Curitiba)"
        required: false
        type: string
      create_draft:
        description: "Criar um rascunho diário real; se falso, executar apenas prévia"
        required: false
        default: false
        type: boolean
      run_weekly:
        description: "Gerar uma prévia semanal sem publicar"
        required: false
        default: false
        type: boolean
      create_weekly_draft:
        description: "Criar rascunho semanal real (sem publicar; exige data da semana)"
        required: false
        default: false
        type: boolean
      weekly_start_date:
        description: "Primeiro dia da semana para a prévia (AAAA-MM-DD; vazio = hoje)"
        required: false
        type: string
      inventory_only:
        description: "Gerar CSV somente de leitura com todos os posts e páginas"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blogger-publicacao-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DATE: ${{ inputs.publish_date }}
      WEEKLY_START_DATE: ${{ inputs.weekly_start_date }}
      INVENTORY_ONLY: ${{ inputs.inventory_only }}
      WEEKLY_DRY_RUN: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.create_weekly_draft) && 'false' || 'true' }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.create_draft && 'false' || 'true') }}
      DRAFT: ${{ github.event_name == 'schedule' && 'false' || (inputs.create_draft && 'true' || 'false') }}
      CARD_COMMIT: 'false'
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        if: env.INVENTORY_ONLY != 'true'
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Validar branch da publicação
        if: env.DRY_RUN == 'false' && github.ref != 'refs/heads/main'
        run: |
          echo "A criação de post e cartão públicos deve ser executada na branch main."
          exit 1

      - name: Gerar inventário somente de leitura
        if: github.event_name == 'workflow_dispatch' && inputs.inventory_only
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN || secrets.BLOGGER_REFFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python blogger_inventory.py --output inventario-somos-servos.csv

      - name: Disponibilizar CSV do inventário
        if: success() && github.event_name == 'workflow_dispatch' && inputs.inventory_only
        uses: actions/upload-artifact@v4
        with:
          name: inventario-somos-servos-${{ github.run_id }}
          path: inventario-somos-servos.csv
          if-no-files-found: error
          retention-days: 14

      - name: Validar autenticação e executar publicação diária
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.inventory_only || inputs.create_weekly_draft)) && (github.event_name != 'schedule' || github.event.schedule == '5 9 * * *') }}
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN || secrets.BLOGGER_REFFRESH_TOKEN }}
        run: python publication_run.py diário

      - name: Validar autenticação e executar resumo semanal
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.inventory_only) && ((github.event_name == 'schedule' && github.event.schedule == '0 11 * * 0') || (github.event_name == 'workflow_dispatch' && (inputs.run_weekly || inputs.create_weekly_draft))) }}
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN || secrets.BLOGGER_REFFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ "${{ inputs.create_weekly_draft }}" = 'true' ] && [ -z "$WEEKLY_START_DATE" ]; then
            echo 'Informe o primeiro dia da semana (AAAA-MM-DD) antes de criar o rascunho.'
            exit 1
          fi
          python publication_run.py semanal

      - name: Salvar cartão e legenda no GitHub Pages
        if: success() && (github.event_name != 'schedule' || github.event.schedule == '5 9 * * *') && env.DRY_RUN == 'false' && env.CARD_COMMIT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cartoes/
          if git diff --cached --quiet; then
            echo "O cartão desta data já está atualizado."
            exit 0
          fi
          CARD_DATE="${PUBLISH_DATE:-hoje}"
          git commit -m "Adicionar cartão Somos Servos ${CARD_DATE}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Disponibilizar PNG e legenda da prévia
        if: success() && env.DRY_RUN == 'true' && github.event_name == 'workflow_dispatch' && inputs.inventory_only != true
        uses: actions/upload-artifact@v4
        with:
          name: cartao-legenda-${{ github.run_id }}
          path: |
            cartoes/*.png
            cartoes/*.txt
          if-no-files-found: ignore
          retention-days: 14


      - name: Preservar evidência mesmo em falha
        if: always() && hashFiles('.publicacoes-pendentes.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-publicacoes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publicacoes.csv
            .publicacoes-pendentes.jsonl
          include-hidden-files: true
          if-no-files-found: error

      - name: Registrar execução no repositório
        if: always() && hashFiles('.publicacoes-pendentes.jsonl') != ''
        run: python commit_publicacoes.py
