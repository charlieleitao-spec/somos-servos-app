name: Correção auditada do Blogger

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Aplicar as alterações reais (deixe desmarcado para simulação)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: blogger-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correction:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth beautifulsoup4

      - name: Simular ou aplicar correções
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN || secrets.BLOGGER_REFFRESH_TOKEN }}
          APPLY_CHANGES: ${{ inputs.apply_changes }}
        run: |
          set -o pipefail
          if [ "$APPLY_CHANGES" = "true" ]; then
            python corrigir_posts_somos_servos.py --apply --confirm-apply 2>&1 | tee blogger-correction.log
          else
            python corrigir_posts_somos_servos.py 2>&1 | tee blogger-correction.log
          fi

      - name: Guardar log e backups JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-correction-${{ github.run_id }}
          path: |
            blogger-correction.log
            backups/blogger-posts/*.json
          if-no-files-found: warn
          retention-days: 14
