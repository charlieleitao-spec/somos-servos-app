name: Atualizar link autorizado Liturgia OSM 4.9.138
on:
  push:
    branches: ['release/link-liturgia-4.9.138']
    paths: ['.github/workflows/atualizar-link-liturgia-4.9.138.yml']
permissions:
  contents: read
concurrency:
  group: atualizar-link-liturgia-4.9.138
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar somente o link e o rótulo autorizados
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN || secrets.BLOGGER_REFFRESH_TOKEN }}
          PYTHONPATH: .
        run: python scripts/atualizar-link-liturgia-4.9.138.py
      - name: Preservar evidência da atualização pontual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-link-liturgia-4.9.138
          path: auditoria-link-4.9.138/
          if-no-files-found: warn
