<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5a2029">
  <meta name="description" content="Somos Servos da Virgem Gloriosa — espiritualidade dos Servos de Maria.">
  <title>Somos Servos</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <img src="./icon-192.png" alt="Somos Servos" width="40" height="40">
      <div><strong>Somos Servos</strong><span>Servos de Maria</span></div>
    </div>
    <button id="installButton" type="button" hidden>Instalar</button>
  </header>

  <main>
    <iframe
      id="blogFrame"
      title="Somos Servos da Virgem Gloriosa"
      src="https://somosservos.blogspot.com/?m=1"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <section id="fallback" class="fallback" hidden>
      <img src="./icon-192.png" alt="Somos Servos" width="96" height="96">
      <h1>Somos Servos</h1>
      <p>Não foi possível carregar o blog agora. Verifique sua conexão com a internet.</p>
      <button id="retryButton" type="button">Tentar novamente</button>
      <a href="https://somosservos.blogspot.com/?m=1" target="_blank" rel="noopener">Abrir no navegador</a>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
